include required(classpath("application"))

backend {
  default = slurm
  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        run-in-background = true
        runtime-attributes = """
        String? docker
        String? docker_user
        Int cpu = 1
        Int memory_mb = 2048
        Int gpuCount = 0
        """
        submit = "/usr/bin/env bash ${script}"
        submit-docker = """
        docker run --rm -i \
          ${"--user " + docker_user} \
          --entrypoint ${job_shell} \
          --cpus ${cpu} \
          --memory ${memory_mb}m \
          ${if gpuCount > 0 then "--gpus " + gpuCount else ""} \
          -v ${cwd}:${docker_cwd} \
          ${docker} ${docker_script}
        """
        root = "cromwell-executions"
        filesystems {
          local {
            localization: ["hard-link", "soft-link", "copy"]
          }
        }
      }
    }

    slurm {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        runtime-attributes = """
        Int runtime_minutes = 1440
        Int cpu = 1
        Int memory_mb = 4096
        Int gpuCount = 0
        String? docker
        String? queue
        String? gres
        """

        submit = """
        sbatch \
          --wait \
          -J ${job_name} \
          -D ${cwd} \
          -o ${out} \
          -e ${err} \
          -t ${runtime_minutes} \
          ${"-c " + cpu} \
          --mem=${memory_mb} \
          ${"-p " + queue} \
          ${gres} \
          --wrap "/usr/bin/env bash ${script}"
        """

        submit-docker = """
        if [ -z "$SINGULARITY_CACHEDIR" ]; then
          CACHE_DIR="$HOME/.singularity/cache"
        else
          CACHE_DIR="$SINGULARITY_CACHEDIR"
        fi
        mkdir -p "$CACHE_DIR"
        LOCK_FILE="$CACHE_DIR/singularity_pull_flock"
        flock --exclusive --timeout 1800 "$LOCK_FILE" \
          singularity exec --containall docker://${docker} echo "pulled ${docker}"

        sbatch \
          --wait \
          -J ${job_name} \
          -D ${cwd} \
          -o ${cwd}/execution/stdout \
          -e ${cwd}/execution/stderr \
          -t ${runtime_minutes} \
          ${"-c " + cpu} \
          --mem=${memory_mb} \
          ${"-p " + queue} \
          ${gres} \
          --wrap "singularity exec --containall ${if gpuCount > 0 then "--nv" else ""} --bind ${cwd}:${docker_cwd} docker://${docker} ${job_shell} ${docker_script}"
        """

        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
        root = "cromwell-executions"
        filesystems {
          local {
            localization: ["hard-link", "soft-link", "copy"]
          }
        }
      }
    }
  }
}

call-caching {
  enabled = true
}

system {
  job-shell = "/bin/bash"
  max-concurrent-workflows = 50
}
